<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3D279" />
    </linearGradient>
    <linearGradient id="innerDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Card with Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="url(#innerDark)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Top Arabic Title: صالة جعفر -->
  <g id="topTitle" fill="url(#goldGrad)" filter="url(#goldGlow)" text-anchor="middle">
    <text x="256" y="125" font-family="'Cairo', 'Tajawal', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="1">صالة جعفر</text>
  </g>

  <!-- Central Graphic: Hourglass & PlayStation Controllers -->
  <g id="centerGraphic" transform="translate(256, 275)">
    <!-- Left PlayStation Controller -->
    <g transform="translate(-85, 0) rotate(15)" fill="url(#goldGrad)">
      <!-- Controller Body -->
      <path d="M-60 -45 C-40 -60 0 -55 20 -40 C35 -25 35 15 25 45 C18 65 -5 75 -25 65 C-45 55 -55 30 -60 0 Z" opacity="0.95" />
      <!-- Left D-Pad -->
      <path d="M-38 -20 h8 v-8 h6 v8 h8 v6 h-8 v8 h-6 v-8 h-8 z" fill="#0c0d10" />
      <!-- Left Thumbstick -->
      <circle cx="-15" cy="18" r="14" fill="#0c0d10" stroke="url(#goldGrad)" stroke-width="3" />
    </g>

    <!-- Right PlayStation Controller -->
    <g transform="translate(85, 0) rotate(-15)" fill="url(#goldGrad)">
      <!-- Controller Body -->
      <path d="M60 -45 C40 -60 0 -55 -20 -40 C-35 -25 -35 15 -25 45 C-18 65 5 75 25 65 C45 55 55 30 60 0 Z" opacity="0.95" />
      <!-- Right Action Buttons (Triangle, Circle, Cross, Square) -->
      <circle cx="38" cy="-28" r="4.5" fill="#0c0d10" />
      <circle cx="48" cy="-18" r="4.5" fill="#0c0d10" />
      <circle cx="28" cy="-18" r="4.5" fill="#0c0d10" />
      <circle cx="38" cy="-8" r="4.5" fill="#0c0d10" />
      <!-- Right Thumbstick -->
      <circle cx="15" cy="18" r="14" fill="#0c0d10" stroke="url(#goldGrad)" stroke-width="3" />
    </g>

    <!-- Center Hourglass (ساعة رملية) -->
    <!-- Top & Bottom Plates -->
    <rect x="-65" y="-88" width="130" height="14" rx="6" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <rect x="-65" y="74" width="130" height="14" rx="6" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    
    <!-- Hourglass Columns -->
    <rect x="-56" y="-80" width="8" height="160" rx="3" fill="url(#goldGrad)" />
    <rect x="48" y="-80" width="8" height="160" rx="3" fill="url(#goldGrad)" />

    <!-- Glass Bulb Shape -->
    <path d="M-45 -74 L45 -74 C45 -30 14 -8 6 0 C14 8 45 30 45 74 L-45 74 C-45 30 -14 8 -6 0 C-14 -8 -45 -30 -45 -74 Z" 
          fill="#0c0d10" stroke="url(#goldGrad)" stroke-width="6" />

    <!-- Sand in Top Bulb -->
    <path d="M-36 -32 C-20 -32 20 -32 36 -32 L0 -4 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Sand Stream -->
    <line x1="0" y1="-4" x2="0" y2="40" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Sand in Bottom Bulb -->
    <path d="M-40 68 C-25 40 25 40 40 68 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom Arabic Subtitle: لألعاب البلايستيشن والتوقيت -->
  <g id="bottomSubtitle" fill="url(#goldGrad)" filter="url(#goldGlow)" text-anchor="middle">
    <text x="256" y="425" font-family="'Cairo', 'Tajawal', system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="0.5">لألعاب البلايستيشن والتوقيت</text>
  </g>
</svg>